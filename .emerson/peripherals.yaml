# Simulated hardware for the RP2350 insulin pump.
#
# Pulled from ghcr.io/tuliptreetech/emerson/rp2350 by 'emerson peripherals pull'
# and then trimmed to the four parts this product actually has. Edits here take
# effect the next time a session is created ('emerson stop && emerson start').
#
# Board wiring -- keep firmware/board.h in sync with this file:
#
#   i2c0  GP4=SDA, GP5=SCL   SSD1306 OLED @0x3C, Sensirion SLF3S-1300F @0x08
#   sio   GP2=STEP, GP3=DIR, GP6=nFAULT   DRV8825 driving the syringe lead screw
#   adc   channel 1 = GP27                Honeywell ABP line-pressure sensor

# == I2C =====================================================================
/MEM/i2c0:
  # 128x64 monochrome OLED: the pump's user-facing display.
  - name: oled
    address: 0x3C
    native: ssd1306

  # Sensirion SLF3S-1300F liquid flow sensor, inline on the delivery tubing.
  # This is the independent check that insulin actually moved -- the stepper
  # reports what it *commanded*, the flow sensor reports what happened.
  - name: flow
    address: 0x08
    native: slf3x

# == ADC =====================================================================
/MEM/adc:
  # Honeywell ABP on GP27, teed into the line downstream of the syringe.
  # Occlusion shows up here as a pressure rise before the flow sensor sees
  # delivery fall off.
  - name: pressure
    channel: 1
    native: abp_pressure

# == Pin-wired devices =======================================================
/MEM/sio:
  # DRV8825 microstepping driver on the syringe lead screw. STEP/DIR are
  # bit-banged from SIO; nFAULT is the driver's open-drain fault output.
  #
  # ul_per_microstep folds barrel area, screw pitch, steps/rev and the
  # microstep setting into one delivery constant. 0.05 uL/microstep gives
  # 20 microsteps per 1 uL, fine enough for a 0.025 U basal increment.
  - name: stepper
    native: drv8825
    pins:
      step: 2
      dir: 3
      fault: 6
    ul_per_microstep: 0.05
